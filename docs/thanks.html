<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спасибо — Aeroway</title>
  <meta name="theme-color" content="#050b1b">
  <meta name="google" content="notranslate">
  <link rel="icon" href="https://raw.githubusercontent.com/RaccoonLaptop/Aeroway/main/Assets/icon-readme.png">
  <link rel="stylesheet" href="site.css">
  <script>
    document.documentElement.classList.add("js");
    window.addEventListener("load", function () {
      window.setTimeout(function () {
        if (!document.documentElement.classList.contains("motion-ready")) {
          document.documentElement.classList.add("motion-fallback");
        }
      }, 800);
    });
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row bar-inner">
      <a class="brand" href="./">
        <img src="https://raw.githubusercontent.com/RaccoonLaptop/Aeroway/main/Assets/icon-readme.png" alt="" width="36" height="36">
        Aeroway
      </a>
      <a class="btn btn-ghost" href="./">К руководству</a>
    </div>
  </header>
  <main class="narrow thanks" data-stagger data-assembly>
    <img class="mark" data-reveal src="https://raw.githubusercontent.com/RaccoonLaptop/Aeroway/main/Assets/icon-readme.png" alt="Aeroway" width="76" height="76">
    <h1 data-reveal>Спасибо</h1>
    <p data-reveal>Поддержка Aeroway получена.</p>
    <div class="thanks-links" data-reveal>
      <a href="./">К руководству</a>
      · <a href="https://github.com/RaccoonLaptop/Aeroway">GitHub</a>
      · <a href="https://t.me/AerowayUI">Telegram</a>
    </div>
  </main>
  <script src="wavy.js"></script>
  <script src="motion.js"></script>
</body>
</html>
